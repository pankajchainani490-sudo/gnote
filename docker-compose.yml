version: '3.8'

services:
  gnote:
    build: .
    container_name: gnote
    restart: unless-stopped
    ports:
      - "3005:3001"
    volumes:
      - gnote-data:/app/server/data
    environment:
      - PORT=3001
      - API_KEY=change-me-to-a-secure-key
      - DATA_DIR=/app/server/data
      - NODE_ENV=production

volumes:
  gnote-data:
